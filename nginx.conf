server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Atrás do proxy do Coolify: redireciona sem trocar host/porta (ex.: /admin -> /admin/)
  absolute_redirect off;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;
  gzip_min_length 1024;

  # Cabeçalhos só aqui: as locations usam "expires" (não add_header) para herdá-los
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # A câmera é usada só pelo provador virtual do próprio site
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

  # HTML sempre fresco; CSS/JS levam ?v= no endereço e podem ficar em cache
  location ~* \.html?$ { expires epoch; }
  location ~* \.(css|js)$ { expires 7d; }

  location /admin/ {
    expires epoch;
    try_files $uri $uri/ /admin/index.html;
  }

  location / {
    expires epoch;
    try_files $uri $uri/ /index.html;
  }
}
